name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please include enough detail to reproduce.
  - type: input
    id: version
    attributes:
      label: lmux version
      description: Shown at the bottom of the sidebar (e.g. 1.0.226)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 14.5 (M1 Pro)
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent involved
      options:
        - CodeBuddy Code (codebuddy-code)
        - Claude Code (claude)
        - Both / not agent-specific
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Console output, screenshots, or the session's JSONL name if relevant
    validations:
      required: false
