# Build lmux.app and attach it to a GitHub Release.
#
# Manual trigger (Actions → Release → Run workflow) while the packaging
# pipeline stabilizes; switch the `on:` block to `push: tags: ["v*"]` once
# green.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # libghostty-spm declares swift-tools-version 6.0, but the macos-14
      # default toolchain is Swift 5.10 — pick the newest Xcode 16 available.
      - name: Select Xcode 16 (Swift 6)
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "no Xcode 16 found:"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$XC"
          swift --version

      # libghostty-spm is pinned to our fork's `lmux-pinned` branch: it carries
      # the TerminalSurface API (close/sendText/readViewportText) that lmux
      # uses. Upstream main and the upstream.1.3.1 tag have already moved on.
      - name: Fetch local package dependencies
        run: |
          rm -rf SwiftTerm libghostty-spm
          git clone --depth 1 --branch lmux-pinned https://github.com/LiManshiang/libghostty-spm.git libghostty-spm
          git clone https://github.com/migueldeicaza/SwiftTerm.git SwiftTerm
          git -C SwiftTerm checkout 4acb12f
          git -C SwiftTerm apply "$GITHUB_WORKSPACE/lmux-app/tools/patches/swiftterm-5.7-backport.patch"

      # The pinned libghostty-spm revision declares two vendored dependencies
      # (vendor/MSDisplayLink and vendor/GhosttyKit.xcframework) that aren't
      # part of its source tree — provide them here.
      - name: Provide libghostty vendored dependencies
        run: |
          git clone --depth 1 https://github.com/Lakr233/MSDisplayLink.git libghostty-spm/vendor/MSDisplayLink
          # Prebuilt GhosttyKit matching the pinned libghostty revision (C API
          # must line up with its Swift wrapper). Uploaded as a release asset
          # because the 127MB binary target can't live in git.
          curl -fsSL -o "$RUNNER_TEMP/ghosttykit.zip" \
            https://github.com/LiManshiang/libghostty-spm/releases/download/ghosttykit-pinned/GhosttyKit.xcframework.zip
          unzip -q "$RUNNER_TEMP/ghosttykit.zip" -d libghostty-spm/vendor/
          ls libghostty-spm/vendor/

      - name: Build lmux.app
        run: |
          # Start from a clean SwiftPM state: committed Xcode user data used to
          # leak this machine's absolute paths into dependency resolution.
          rm -rf lmux-app/.swiftpm lmux-app/.build
          echo "--- residual local-path references (should be none) ---"
          grep -rl "swift-argument-parser" lmux-app --include="*.json" --include="*.plist" 2>/dev/null | head -3 || true
          cd lmux-app && make app

      - name: Package zip
        run: |
          cd lmux-app/.build
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" lmux.app/Contents/Info.plist)
          NAME="lmux-${VERSION}-macos"
          # `ditto -c -k` on the runner produced archives that `unzip` (and
          # therefore Homebrew) rejects with bad-CRC/offset errors. Use the
          # standard zip tool (-y keeps symlinks, -X drops extra attributes)
          # and verify the result before it is uploaded.
          /usr/bin/zip -r -y -X "../../${NAME}.zip" lmux.app > /dev/null
          /usr/bin/zip -r -y -X ../../lmux-macos.zip lmux.app > /dev/null
          unzip -t "../../${NAME}.zip" > /dev/null
          unzip -t ../../lmux-macos.zip > /dev/null
          echo "zip verified: $(ls -l ../../lmux-macos.zip | awk '{print $5}') bytes"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ZIP=${NAME}.zip" >> "$GITHUB_ENV"

      # workflow_dispatch runs have no tag; derive one from the bundle version
      # so the zip still lands in a proper GitHub Release.
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: lmux ${{ env.VERSION }}
          files: |
            ${{ env.ZIP }}
            lmux-macos.zip
          generate_release_notes: true
