# Build lmux.app and attach it to a GitHub Release.
#
# Triggers:
#   - push a tag like v1.0.227  → builds and publishes that release
#   - Actions → Release → Run workflow (manual, tags by bundle version)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-14 only carries Xcode 16 (Swift 5.10), which has no `--build-system
    # swiftbuild`: its SwiftPM can only drive the deprecated native build system,
    # whose Bundle.module accessor probes the .app root instead of
    # Contents/Resources. That is the toolchain that shipped 1.0.279, which
    # trapped on every user's first terminal session. macos-26 carries Xcode 26
    # (Swift 6.2/6.3), where swiftbuild is available — the Makefile passes it
    # explicitly because those versions still default to native. See the
    # swift_build comment in lmux-app/Makefile.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: lmux-app/backend-src/go.sum

      # libghostty-spm declares swift-tools-version 6.0, so the toolchain has to
      # be Swift 6 or newer; take the newest Xcode the image has rather than
      # pinning a version that goes stale, and let the accessor check in
      # check-app-bundles.sh — not the Xcode number — decide whether the app is
      # shippable.
      - name: Select the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "no Xcode found:"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$XC"
          swift --version
          swift build --help 2>&1 | grep -A1 -- '--build-system' || true

      # Xcode 26 moved the Metal compiler into a separately downloaded
      # component, and SwiftTerm's renderer compiles Shaders.metal: without it
      # the build dies with "unable to spawn process .../Metal.xctoolchain/
      # usr/bin/metal". Install it only when the image is missing it.
      - name: Ensure the Metal toolchain is present
        run: |
          if ! xcrun -f metal >/dev/null 2>&1; then
            echo "Metal toolchain not installed, downloading the component..."
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -f metal

      # libghostty-spm is pinned to our fork's `lmux-pinned` branch: it carries
      # the TerminalSurface API (close/sendText/readViewportText) that lmux
      # uses. Upstream main and the upstream.1.3.1 tag have already moved on.
      - name: Fetch local package dependencies
        run: |
          rm -rf SwiftTerm libghostty-spm
          git clone --depth 1 --branch lmux-pinned https://github.com/LiManshiang/libghostty-spm.git libghostty-spm
          git clone https://github.com/migueldeicaza/SwiftTerm.git SwiftTerm
          git -C SwiftTerm checkout 4acb12f
          git -C SwiftTerm apply "$GITHUB_WORKSPACE/lmux-app/tools/patches/swiftterm-5.7-backport.patch"

      # The pinned libghostty-spm revision declares two vendored dependencies
      # (vendor/MSDisplayLink and vendor/GhosttyKit.xcframework) that aren't
      # part of its source tree — provide them here.
      - name: Provide libghostty vendored dependencies
        run: |
          git clone --depth 1 https://github.com/Lakr233/MSDisplayLink.git libghostty-spm/vendor/MSDisplayLink
          # Prebuilt GhosttyKit matching the pinned libghostty revision (C API
          # must line up with its Swift wrapper). Uploaded as a release asset
          # because the 127MB binary target can't live in git.
          curl -fsSL -o "$RUNNER_TEMP/ghosttykit.zip" \
            https://github.com/LiManshiang/libghostty-spm/releases/download/ghosttykit-pinned/GhosttyKit.xcframework.zip
          unzip -q "$RUNNER_TEMP/ghosttykit.zip" -d libghostty-spm/vendor/
          ls libghostty-spm/vendor/

      - name: Build lmux.app
        run: |
          # Start from a clean SwiftPM state: committed Xcode user data used to
          # leak this machine's absolute paths into dependency resolution.
          rm -rf lmux-app/.swiftpm lmux-app/.build
          echo "--- residual local-path references (should be none) ---"
          grep -rl "swift-argument-parser" lmux-app --include="*.json" --include="*.plist" 2>/dev/null | head -3 || true
          cd lmux-app && make app

      # Intel (x86_64) build, cross-compiled on the same runner. Ghostty has no
      # x86_64 slice, so this variant swaps in the SwiftTerm renderer
      # (Package.st.swift) and targets macOS 12 — same code line, different
      # renderer. The backend is rebuilt for amd64 with cgo.
      - name: Build lmux.app (Intel / x86_64)
        run: |
          cd lmux-app && make app-x86
          file "$GITHUB_WORKSPACE/lmux-app/.build/lmux-st.app/Contents/MacOS/lmux" | grep -q x86_64 \
            || { echo "ERROR: Intel build is not x86_64"; exit 1; }
          file "$GITHUB_WORKSPACE/lmux-app/.build/lmux-st.app/Contents/MacOS/lmux-backend" | grep -q x86_64 \
            || { echo "ERROR: Intel backend is not x86_64"; exit 1; }
          echo "Intel bundle verified: $(lipo -archs "$GITHUB_WORKSPACE/lmux-app/.build/lmux-st.app/Contents/MacOS/lmux")"

      # The app traps with fatalError on its first terminal session if these are
      # missing (see the assemble_bundle comment in lmux-app/Makefile). Releases
      # shipped broken for months because nothing verified this; fail the build
      # here instead of handing users a crash on launch.
      #
      # The check asserts what "shippable" actually means: both bundles in
      # Contents/Resources with their payload, and a frontend built by
      # swiftbuild rather than the deprecated native system, whose accessor
      # probes the .app root — where codesign forbids the bundles. The old
      # "a *.bundle exists" version of this check passed on the broken 1.0.279.
      - name: Verify packaged resource bundles
        run: |
          bash lmux-app/tools/check-app-bundles.sh \
            lmux-app/.build/lmux.app \
            lmux-app/.build/lmux-st.app

      - name: Package zip
        run: |
          cd lmux-app/.build
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" lmux.app/Contents/Info.plist)
          NAME="lmux-${VERSION}-macos"
          # `ditto -c -k` on the runner produced archives that `unzip` (and
          # therefore Homebrew) rejects with bad-CRC/offset errors. Use the
          # standard zip tool (-y keeps symlinks, -X drops extra attributes)
          # and verify the result before it is uploaded.
          /usr/bin/zip -r -y -X "../../${NAME}.zip" lmux.app > /dev/null
          /usr/bin/zip -r -y -X ../../lmux-macos.zip lmux.app > /dev/null
          unzip -t "../../${NAME}.zip" > /dev/null
          unzip -t ../../lmux-macos.zip > /dev/null

          # Intel build: shipped as lmux.app so the cask's `app "lmux.app"`
          # stanza works for both architectures.
          rm -rf intel && mkdir intel && cp -R lmux-st.app intel/lmux.app
          (cd intel && /usr/bin/zip -r -y -X "$GITHUB_WORKSPACE/${NAME}-intel.zip" lmux.app > /dev/null)
          (cd intel && /usr/bin/zip -r -y -X "$GITHUB_WORKSPACE/lmux-macos-intel.zip" lmux.app > /dev/null)
          unzip -t "$GITHUB_WORKSPACE/${NAME}-intel.zip" > /dev/null
          unzip -t "$GITHUB_WORKSPACE/lmux-macos-intel.zip" > /dev/null

          echo "arm64 zip: $(ls -l "$GITHUB_WORKSPACE/lmux-macos.zip" | awk '{print $5}') bytes"
          echo "intel zip: $(ls -l "$GITHUB_WORKSPACE/lmux-macos-intel.zip" | awk '{print $5}') bytes"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ZIP=${NAME}.zip" >> "$GITHUB_ENV"
          echo "INTEL_ZIP=${NAME}-intel.zip" >> "$GITHUB_ENV"

      # On a tag push use that tag; for manual runs derive one from the bundle
      # version so the zip still lands in a proper GitHub Release.
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.VERSION) }}
          name: lmux ${{ env.VERSION }}
          files: |
            ${{ env.ZIP }}
            ${{ env.INTEL_ZIP }}
            lmux-macos.zip
            lmux-macos-intel.zip
          generate_release_notes: true
